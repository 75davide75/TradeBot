<!DOCTYPE html><html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TradeBot</title>
<!-- Senza questo i controlli nativi e lo sfondo di scorrimento restano chiari
     anche quando il resto della pagina e' passato al tema scuro. -->
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!-- ?v= va incrementato a ogni pubblicazione: GitHub Pages serve CSS e JS con
     cache, e senza il numero un aggiornamento puo' arrivare al browser meta'
     vecchio e meta' nuovo. data.json ha gia' la sua marca temporale. -->
<link rel="stylesheet" href="tema.css?v=4">
<link rel="stylesheet" href="dashboard.css?v=4">
</head><body>
<div class="wrap">

<header>
  <div>
    <h1>TradeBot <span class="tag" id="mkt">perpetui</span></h1>
    <div class="sub" id="sub">caricamento…</div>
  </div>
  <div class="ctrl">
    <a class="btnlink" href="ricerca.html">Report tecnico</a>
    <button id="live"><span class="dot"></span><span id="livetxt">Avvia live</span></button>
    <button id="rel">Ricarica</button>
  </div>
</header>

<div id="alert"></div>
<div class="wallets" id="wallets"></div>
<div class="kpis" id="kpis"></div>

<h2>Andamento del portafoglio</h2>
<div class="card eqbox"><div id="eq"></div>
  <div id="eqnote" style="padding:6px 2px 12px;font-size:12.5px;color:var(--faint)"></div>
  <div id="ia" style="padding:0 2px 12px;font-size:12.5px"></div>
</div>

<h2>Rendimento annuo stimato</h2>
<div class="card eqbox">
  <div id="proj"></div>
  <div id="projnote" style="padding:2px 2px 12px;font-size:12.5px;color:var(--faint)"></div>
</div>

<h2 id="postit">Segnale momentum · Reale e Ombra</h2>
<div class="grid" id="pos"><div class="skel">caricamento…</div></div>

<h2>Mercati scelti dall'IA</h2>
<div id="ianota" class="nota-sez"></div>
<div class="grid" id="posia"></div>

<h2>Storico operazioni</h2>
<div id="opsnota" class="nota-sez"></div>
<div class="filtri" id="filtri"></div>
<div class="card tabellabox"><table><thead><tr>
  <th>Data</th><th>Portafoglio</th><th>Tipo</th><th>Mercato</th>
  <th>Prezzo</th><th>Nozionale</th><th>Leva</th><th>Motivo</th>
</tr></thead><tbody id="ops"></tbody></table></div>

<footer id="ft"></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script src="dashboard.js?v=4"></script>
</body></html>
